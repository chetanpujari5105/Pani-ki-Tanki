name: TankiAlert
options:
  deploymentTarget:
    macOS: "13.0"
targets:
  TankiAlert:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: ["Resources/.gitkeep", "Resources/sounds"]
      # Built-in alert sounds, copied as a folder so they land in Contents/Resources/sounds/.
      - path: Sources/Resources/sounds
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chetan.tankialert
        PRODUCT_NAME: TankiAlert
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
